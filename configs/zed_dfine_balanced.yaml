camera:
  camera_id: 0
  resolution: HD1080
  fps: 60
  stream_type: left+depth
  use_factory_calib: true
  use_distortion_correction: true
  calibration_file: /usr/local/zed/settings/SN40013030.conf
  # 相机内参，开启出厂标定后会自动覆盖。
  fx: 1000.0
  fy: 1000.0
  cx: 960.0
  cy: 540.0
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

infer:
  config_file: configs/infer/config_infer_primary_dfine_ball.txt
  # 下列字段当前仅作为模板信息保留，实际生效路径由 config_file 模板决定。
  onnx_file: model/best_stg2.onnx
  engine_file: model/best_stg2.onnx_b1_gpu0_fp16.engine
  labels: configs/labels_ball.txt
  threshold: 0.75

depth:
  roi_ratio: 0.10
  min_valid_ratio: 0.25
  min_depth: 0.10
  max_depth: 20.00

perf:
  # 下列字段当前仅作为运行记录项保留，尚未直接驱动控制逻辑。
  target_fps: 60
  latency_budget_ms: 50
  window_sec: 5
  warmup_sec: 8

output:
  enable_osd: true
  json_path: logs/frame_result_balanced.jsonl
  perf_log_interval_sec: 5
  flush_interval_sec: 1
  display: true
