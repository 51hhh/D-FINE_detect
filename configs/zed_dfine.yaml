camera:
  camera_id: 0
  resolution: SVGA
  fps: 120
  stream_type: left+depth
  use_factory_calib: true
  use_distortion_correction: true
  calibration_file: /usr/local/zed/settings/SN40013030.conf
  fx: 700.0
  fy: 700.0
  cx: 480.0
  cy: 300.0
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

infer:
  config_file: configs/infer/config_infer_primary_dfine_ball.txt
  onnx_file: model/best_stg1.onnx
  engine_file: model/best_stg1_fp16.engine
  labels: configs/labels_ball.txt
  # 只需要修改这一处阈值，程序会在运行时写入 nvinfer 配置。
  threshold: 0.75

depth:
  roi_ratio: 0.10
  min_valid_ratio: 0.20
  min_depth: 0.10
  max_depth: 20.00

perf:
  target_fps: 120
  latency_budget_ms: 35
  window_sec: 5
  warmup_sec: 8

output:
  enable_osd: true
  json_path: logs/frame_result.jsonl
  perf_log_interval_sec: 5
  # flush 间隔，1 表示每秒刷盘一次。0 表示每帧刷盘（120fps 下慎用）。
  flush_interval_sec: 1
  display: true
